name: dropclip_desktop
description: DropClip Desktop Application Target (macOS & Windows)
version: 1.0.5+6
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  dropclip_protocol:
    path: ../../packages/dropclip_protocol
  dropclip_core:
    path: ../../packages/dropclip_core
  dropclip_clipboard:
    path: ../../packages/dropclip_clipboard
  dropclip_transfer:
    path: ../../packages/dropclip_transfer
  dropclip_ui:
    path: ../../packages/dropclip_ui
  dropclip_macos:
    path: ../../packages/dropclip_macos
  dropclip_windows:
    path: ../../packages/dropclip_windows
  flutter:
    sdk: flutter
  tray_manager: ^0.5.0
  window_manager: ^0.5.0
  bonsoir: ^7.1.6
  desktop_drop: ^0.9.2
  ffi: ^2.2.0
  shelf: ^1.4.3
  qr_flutter: ^4.1.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/

