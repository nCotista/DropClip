name: dropclip_mobile
description: DropClip Mobile Application Target (Android & iOS)
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dropclip_protocol:
    path: ../../packages/dropclip_protocol
  dropclip_core:
    path: ../../packages/dropclip_core
  dropclip_clipboard:
    path: ../../packages/dropclip_clipboard
  dropclip_transfer:
    path: ../../packages/dropclip_transfer
  dropclip_ui:
    path: ../../packages/dropclip_ui
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.5.0
  shelf: ^1.4.3
  bonsoir: ^7.1.6
  file_picker: ^13.3.3
  open_filex: ^5.0.0

dev_dependencies:
  crypto: ^3.0.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true

