name: Mobile Build (T2.5)

# Builds the phone apps on every change that can affect them, so a broken
# Android or iOS build is caught without a local SDK.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --debug

  ios:
    name: iOS app (no codesign)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Build iOS
        working-directory: apps/mobile
        run: flutter build ios --debug --no-codesign
