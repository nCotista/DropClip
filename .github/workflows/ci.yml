name: DropClip Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Flutter bundles Dart; needed since dropclip_ui is a Flutter package (T1.12).
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Check Code Formatting
        run: melos run format

      - name: Analyze Code Quality
        run: melos run analyze

      - name: Run Package Tests
        run: melos run test

  native-windows-core:
    name: Native Windows Clipboard Core Tests (T1.7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run clipboard_core Tests (g++)
        working-directory: native/windows/test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I.. -o clipboard_core_test clipboard_core_test.cpp
          ./clipboard_core_test

  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Plaintext Private Keys & Secrets (NFR-S02)
        run: |
          echo "Scanning codebase for exposed private keys..."
          if grep -rnE "BEGIN (RSA |EC |OPENSSH |ED25519 )?PRIVATE KEY" packages/ apps/ native/; then
            echo "ERROR: Plaintext private key found in repository!"
            exit 1
          fi
          echo "No plaintext private keys found."

