name: Windows Installer

# Builds DropClip-Setup.exe (apps/desktop/installer). On a PR that touches
# the installer it is only uploaded as a workflow artifact; "Run workflow"
# (Actions tab) or pushing a v* tag also publishes it as a GitHub Release,
# so users get it in one click from
# https://github.com/nCotista/DropClip/releases/latest/download/DropClip-Setup.exe
on:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'apps/desktop/installer/**'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build DropClip-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as ci.yml; bump together with local SDKs.
          flutter-version: 3.47.9
          cache: true

      - name: Build apps/desktop (Release)
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Pack installer
        id: pack
        shell: pwsh
        run: |
          ./apps/desktop/installer/build_installer.ps1
          $setup = Get-ChildItem apps/desktop/build/installer/DropClip-Setup-*.exe | Select-Object -First 1
          $version = $setup.BaseName -replace '^DropClip-Setup-', ''
          # Stable name so the "latest" download link never changes.
          Copy-Item $setup.FullName apps/desktop/build/installer/DropClip-Setup.exe
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the setup (extract + install to a temp folder)
        shell: pwsh
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'setup'
          $t = Join-Path $env:RUNNER_TEMP 'DropClip'
          Start-Process apps/desktop/build/installer/DropClip-Setup.exe -ArgumentList '/Q', '/C', "/T:$x" -Wait
          & "$x/install.ps1" -Target $t -NoShortcuts -NoLaunch
          foreach ($f in 'dropclip_desktop.exe', 'flutter_windows.dll', 'vcruntime140.dll', 'data/flutter_assets') {
            if (-not (Test-Path (Join-Path $t $f))) { throw "missing $f after install" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DropClip-Setup-${{ steps.pack.outputs.version }}
          path: apps/desktop/build/installer/DropClip-Setup.exe

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.pack.outputs.version) }}
          name: DropClip ${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** download `DropClip-Setup.exe`, double-click, done. No admin rights needed.

            - If SmartScreen says "Windows protected your PC", choose **More info → Run anyway** (the setup isn't code-signed yet).
            - On first launch allow DropClip on **Private** networks when Windows Firewall asks.
            - Uninstall from **Settings → Apps**. Paired devices are kept for a reinstall.
          files: |
            apps/desktop/build/installer/DropClip-Setup.exe
            apps/desktop/build/installer/DropClip-Setup-${{ steps.pack.outputs.version }}.exe
