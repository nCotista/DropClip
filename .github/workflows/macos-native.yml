name: macOS Native (Swift)

# Builds and tests the Swift code of the macOS plugin (T1.6). Runs on every
# push that touches it, including stacked feature branches.
# macos-15-intel: the arm64 macOS pool was out of capacity (jobs never
# started), and the Intel pool is separate.
on:
  push:
    paths:
      - 'packages/dropclip_macos/**'
      - '.github/workflows/macos-native.yml'
      - 'apps/desktop/pubspec.yaml'
      - 'apps/desktop/macos/Flutter/GeneratedPluginRegistrant.swift'
      - 'apps/desktop/integration_test/**'
  pull_request:
    paths:
      - 'packages/dropclip_macos/**'
      - '.github/workflows/macos-native.yml'
      - 'apps/desktop/pubspec.yaml'
      - 'apps/desktop/macos/Flutter/GeneratedPluginRegistrant.swift'
      - 'apps/desktop/integration_test/**'

jobs:
  swift-test:
    name: Swift core tests (macOS)
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and test DropClipMacCore
        working-directory: packages/dropclip_macos/macos
        run: swift test

  plugin-typecheck:
    name: Flutter plugin compiles (macOS)
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: newer stable deprecates package:flutter/material.dart, which
          # fails `analyze --fatal-infos`. Bump together with local SDKs.
          flutter-version: 3.47.9
          cache: true

      - name: Download the FlutterMacOS framework
        run: flutter precache --macos

      # The plugin class needs FlutterMacOS, which `swift test` does not have.
      - name: Type-check plugin sources against FlutterMacOS
        working-directory: packages/dropclip_macos/macos
        run: |
          FW=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -name FlutterMacOS.framework -path '*macos*' | head -1)
          echo "FlutterMacOS: $FW"
          xcrun swiftc -typecheck \
            -sdk "$(xcrun --show-sdk-path --sdk macosx)" \
            -target "$(uname -m)-apple-macos10.15" \
            -F "$(dirname "$FW")" \
            dropclip_macos/Sources/dropclip_macos/Core/*.swift \
            dropclip_macos/Sources/dropclip_macos/*.swift

      - name: Test registered app clipboard plugin
        working-directory: apps/desktop
        run: flutter test integration_test/clipboard_plugin_test.dart -d macos
