name: Android S0.2 Emulator

on:
  pull_request:
    paths:
      - '.github/workflows/android-spike.yml'
      - 'native/android/spike/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-spike:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: cd native/android/spike && gradle createDebugAndroidTestCoverageReport --stacktrace
      - name: Enforce 75% line coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('native/android/spike/build/reports/coverage').rglob('*.xml'))
          for report in reports:
              root = ET.parse(report).getroot()
              if root.tag != 'report':
                  continue
              counter = next((c for c in root.findall('counter') if c.get('type') == 'LINE'), None)
              if counter is None:
                  continue
              covered = int(counter.get('covered', '0'))
              missed = int(counter.get('missed', '0'))
              percent = 100 * covered / (covered + missed) if covered + missed else 0
              print(f'{report}: {percent:.1f}% line coverage')
              raise SystemExit(0 if percent >= 75 else 1)
          raise SystemExit('Android JaCoCo XML report not found')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-s02-api-${{ matrix.api-level }}
          path: |
            native/android/spike/build/reports/androidTests/connected/
            native/android/spike/build/reports/coverage/
            native/android/spike/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
